# Aethernaut — the standard. Argonaut, metamorphosed.
# Same lineage: cyan italic comments, lime constants, near-white keywords,
# periwinkle classes, violet functions, steel selection — but deeper, cooler,
# more liquid glass. Argonaut's soul, the Æther's skin.
name: Aethernaut
kind: dark
class: theme.dark.aethernaut
tags: [aether, signature, dark, standard, argonaut-lineage]

# Global editor colors
editor:
  background: "0x12141A"
  foreground: "0xB8BEC4"
  caret: "0xFF2200"
  selection: "0x0A3A5C"
  lineHighlight: "0x0A0E15"
  invisibles: "0x000000"

# ── AetherCodex Chrome (liquid glass, more polished) ──
glassTintColor: "0x1A1C24"
glassTint: 0.70
glassBlurStrength: 0.58
glassStyle: regular
textShadowStrength: 0.55
lineSpacing: 4.4
editorBackgroundOpacity: 0.74
sidebarBackgroundOpacity: 0.84
rootBlurMaterial: fullScreenUI
rootBlendingMode: behindWindow
pythiaGlassMaterial: menu

# ── Gutter & Sidebar ──
rulerBackground: "0x0D0E12"
rulerForeground: "0xB8BEC4"
sourceRulerBackground: "0x0D0E12"
rulerSeparator: "0x2E343C7F"
sidebarAccent: "0x6E8CA2"
sidebarForeground: "0xB8BEC4"
gutterSelectionBackground: "0x0A3A5C"
gutterSelectionForeground: "0xDFE3E8"
gutterSelectionBorder: "0x0A8AD0"
sidebarBackground: "0x242A31"

# ── Pythia Oracle Chamber (first-class curated) ──
# Evolved steel-blue accent + warmer amber complementary, deepened code-preview
# surface, lifted shine — tool-call results read as glass, not chrome.
pythia:
  background: "0x12141A"
  foreground: "0xB8BEC4"
  baseText: "0xB8936E"
  accent: "0x6E8CA2"
  complementary: "0xB8936E"
  codeBackground: "0x0E1116"
  codeForeground: "0xB8BEC4"
  shine: "0x9BBCCF"
  glassTint: 0.58
  glassMaterial: menu

